name: Carnivore Planner UI audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: carnivore-planner-ui-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data preservation and offline update behavior
        run: |
          node tests/state-store.mjs
          node tests/stock-consumption.mjs
          node tests/service-worker.mjs
          node tests/release-consistency.mjs
      - name: Validate all cooking guides and safety notes
        run: node tests/cooking-guide.mjs
      - name: Validate weekly shopping and stock calculations
        run: node tests/shopping-math.mjs
      - name: Test 33 recipe images, fast daily flows and stock safety
        run: node tests/media-flow.mjs
      - name: Test stock, time, budget and variety suggestions
        run: node tests/plan-intelligence.mjs
      - name: Test non-invasive on-device diagnostics
        run: node tests/diagnostics.mjs
      - name: Validate catalog and pork substitutions
        run: node tests/catalog-regression.mjs
      - name: Execute complete app startup and verify 33 recipes
        run: node tests/startup-runtime.mjs
      - name: Validate plan-aware calendar export
        run: node tests/calendar-export.mjs
      - name: Install browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          mkdir -p /tmp/carnivore-audit/carnivore-planner
          cp *.js *.css *.html *.json *.webmanifest *.svg *.png /tmp/carnivore-audit/carnivore-planner/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/carnivore-audit &
      - name: Run mobile Chromium regression tests
        run: node tests/smoke.mjs
        env:
          TEST_URL: http://127.0.0.1:4173/carnivore-planner/
      - name: Test real offline PWA, imports, persistence and responsive layouts
        run: node tests/reliability-browser.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-smoke-failure
          path: smoke-failure.png
