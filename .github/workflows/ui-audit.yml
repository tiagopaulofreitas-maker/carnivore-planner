name: Carnivore Planner UI audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all cooking guides and safety notes
        run: node tests/cooking-guide.mjs
      - name: Install browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - name: Run mobile Chromium regression tests
        run: node tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-smoke-failure
          path: smoke-failure.png
